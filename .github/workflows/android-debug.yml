name: Android Debug APK
run-name: Debug APK • ${{ github.ref_name }} • #${{ github.run_number }}

on:
  push:
    branches:
      - feature/auto-vietnamese-translation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The current Android debug build type points at the project's release
      # signing config. Create an ephemeral CI-only keystore with the matching
      # alias/password so the debug APK can be assembled without committing a key.
      - name: Create temporary signing keystore for debug variant
        run: |
          keytool -genkeypair -v \
            -keystore pakeplus.keystore \
            -storepass 1024xiaoshen \
            -alias pakeplus \
            -keypass 1024xiaoshen \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PakePlus CI Debug, OU=CI, O=PakePlus, L=Unknown, ST=Unknown, C=US"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pakeplus-android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
